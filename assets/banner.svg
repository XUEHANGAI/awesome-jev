<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1210"/>
      <stop offset="1" stop-color="#0F1A17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- typed-answer chips, decorative -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" opacity="0.85">
    <rect x="830" y="70" width="300" height="34" rx="6" fill="#132220" stroke="#1E3A34"/>
    <text x="848" y="92" fill="#5EEAD4">choice: "billing"</text>
    <rect x="830" y="116" width="300" height="34" rx="6" fill="#132220" stroke="#1E3A34"/>
    <text x="848" y="138" fill="#5EEAD4">noul: 0.94</text>
    <rect x="830" y="162" width="300" height="34" rx="6" fill="#132220" stroke="#1E3A34"/>
    <text x="848" y="184" fill="#5EEAD4">confidence: 0.88</text>
  </g>

  <text x="80" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#F0FDFA" letter-spacing="-2">Awesome <tspan fill="url(#accent)">Jev</tspan></text>

  <text x="82" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#99B8B0">Typed decisions for software — use cases, SDKs, and resources</text>

  <text x="82" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5F7A72">Jev · TypeSafe AI System One model · Choice / Score / Noul</text>

  <rect x="80" y="58" width="132" height="26" rx="13" fill="#0D9488" opacity="0.18"/>
  <text x="96" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF" letter-spacing="1.5">CURATED LIST</text>
</svg>
